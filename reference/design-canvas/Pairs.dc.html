<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Match pairs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF8F2;color:#1D1B26;font-family:'DM Sans',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible{outline:3px solid #4338CA;outline-offset:2px}
.k{font-family:'JetBrains Mono',monospace;font-size:13px;background:rgba(29,27,38,.08);padding:1px 5px;border-radius:5px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; box-sizing: border-box; background: #FBF8F2; overflow: hidden">
<header style="display: flex; align-items: center; gap: 12px; padding: 12px 16px 8px">
<button type="button" aria-label="Quit lesson" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 12px; color: #5B5868"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div role="progressbar" aria-label="Lesson progress" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100" style="flex-grow: 1; height: 14px; background: #E4DFD4; border-radius: 999px; overflow: hidden"><div style="width: 30%; height: 100%; background: #4338CA; border-radius: 999px"></div></div>
<div aria-label="4 hearts left" style="display: flex; align-items: center; gap: 4px; font-weight: 700; color: #B4461B"><svg width="22" height="22" viewBox="0 0 24 24" fill="#E4572E" stroke="#B4461B" stroke-width="1.5" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.4C1.2 8.4 3.3 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5c3.3 0 5.4 3.4 4.1 6.6C19.5 16.4 12 21 12 21z"></path></svg><span>4</span></div>
</header>
<div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4338CA; background: #EEF0FF; padding: 6px 10px; border-radius: 999px">Match pairs</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.15">Match each property to what it draws</h1>
</div>
<main style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 20px 20px 0">
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{left}}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{p.pick}}" disabled="{{p.done}}" aria-pressed="{{p.pressed}}" style="{{p.style}}">{{p.code}}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{right}}" as="v" hint-placeholder-count="4">
<button type="button" onClick="{{v.pick}}" disabled="{{v.done}}" aria-pressed="{{v.pressed}}" aria-label="{{v.label}}" style="{{v.style}}"><div style="{{v.shape}}"></div></button>
</sc-for>
</div>
</main>
<div style="margin-top: auto">
<sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
<div style="padding: 16px 20px 28px; border-top: 2px solid #E4DFD4; display: flex; align-items: center; justify-content: space-between; min-height: 52px">
<p style="margin: 0; font-size: 15px; color: #5B5868">Tap a property, then its result.</p>
<span style="font-weight: 700; font-size: 15px">{{count}} / 4</span>
</div>
</sc-if>
<sc-if value="{{finished}}" hint-placeholder-val="{{false}}">
<section aria-live="polite" style="display: flex; flex-direction: column; gap: 12px; padding: 20px 20px 28px; background: #E3F4E8">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M7.5 12.5l3 3 6-6.5"></path></svg>
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; color: #15803D">All pairs matched!</h2>
</div>
<p style="margin: 0; font-size: 15px; font-weight: 700">{{missText}}</p>
<p style="margin: 0; font-size: 15px; line-height: 1.45"><span class="k">rotate</span> and <span class="k">scale</span> are standalone shortcuts for <span class="k">transform: rotate()</span> and <span class="k">scale()</span>. Both forms work in every modern browser.</p>
<button type="button" onClick="{{reset}}" style="width: 100%; height: 52px; border-radius: 16px; font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border: 0; border-bottom: 5px solid #0F5E2C; background: #15803D; color: #FFFFFF">Continue</button>
</section>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh();
  }
  fresh() {
    return { l: null, r: null, done: {}, miss: null, misses: 0 };
  }
  componentWillUnmount() {
    clearTimeout(this.t);
  }
  resolve(l, r) {
    if (l === r) {
      const done = Object.assign({}, this.state.done);
      done[l] = true;
      this.setState({ done: done, l: null, r: null, miss: null });
    } else {
      this.setState({ miss: { l: l, r: r }, l: null, r: null, misses: this.state.misses + 1 });
      clearTimeout(this.t);
      this.t = setTimeout(() => this.setState({ miss: null }), 700);
    }
  }
  tile(state) {
    let border = '#E4DFD4';
    let bg = '#FFFFFF';
    let extra = '';
    if (state === 'done') { bg = '#F3F0E8'; extra = 'opacity:.45;'; }
    else if (state === 'miss') { border = '#B4461B'; bg = '#FCEBDF'; }
    else if (state === 'sel') { border = '#4338CA'; bg = '#EEF0FF'; }
    return 'height:76px;width:100%;display:flex;align-items:center;justify-content:center;padding:0 8px;background:' + bg + ';border:2px solid ' + border + ';border-bottom-width:5px;border-radius:16px;color:#1D1B26;' + extra;
  }
  renderVals() {
    const s = this.state;
    const sq = 'width:36px;height:36px;background:#4338CA;border-radius:6px;';
    const pairs = [
      { id: 'op', code: 'opacity: .4', shape: sq + 'opacity:.4', label: 'Faded square' },
      { id: 'br', code: 'border-radius: 50%', shape: sq + 'border-radius:50%', label: 'Circle' },
      { id: 'ro', code: 'rotate: 45deg', shape: sq + 'rotate:45deg', label: 'Tilted square' },
      { id: 'sc', code: 'scale: .5', shape: sq + 'scale:.5', label: 'Half-size square' }
    ];
    const byId = {};
    pairs.forEach((p) => { byId[p.id] = p; });
    const stateOf = (id, side) => {
      if (s.done[id]) return 'done';
      if (s.miss && s.miss[side] === id) return 'miss';
      if (s[side] === id) return 'sel';
      return 'idle';
    };
    const left = pairs.map((p) => {
      const st = stateOf(p.id, 'l');
      return {
        code: p.code,
        done: st === 'done',
        pressed: st === 'sel' ? 'true' : 'false',
        style: this.tile(st) + "font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600",
        pick: () => { if (this.state.r) this.resolve(p.id, this.state.r); else this.setState({ l: p.id, miss: null }); }
      };
    });
    const right = ['br', 'sc', 'op', 'ro'].map((id) => {
      const p = byId[id];
      const st = stateOf(id, 'r');
      return {
        label: p.label,
        shape: p.shape,
        done: st === 'done',
        pressed: st === 'sel' ? 'true' : 'false',
        style: this.tile(st),
        pick: () => { if (this.state.l) this.resolve(this.state.l, id); else this.setState({ r: id, miss: null }); }
      };
    });
    const count = Object.keys(s.done).length;
    return {
      left: left,
      right: right,
      count: count,
      playing: count < 4,
      finished: count === 4,
      missText: s.misses === 0 ? 'Flawless — no mistakes.' : s.misses + (s.misses === 1 ? ' mistake' : ' mistakes') + ' along the way.',
      reset: () => this.setState(this.fresh())
    };
  }
}
</script>
</body>
</html>
